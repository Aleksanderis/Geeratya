# Adds every new or reopened issue to the owner's cross-repository project "Arbaiten"
# (https://github.com/users/Aleksanderis/projects/4). The project's built-in auto-add workflow covers only
# one repository on the free plan (it is used for Gitunia), hence this action. Issues only: a card shows its
# linked PR, and the board's "Pull request linked to issue" workflow moves the issue (owner, 2026-11-12).
# Secret ADD_TO_PROJECT_PAT: classic personal access token with the `project` and `repo` scopes.
name: add-to-project

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/users/Aleksanderis/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
