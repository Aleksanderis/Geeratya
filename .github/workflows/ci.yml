# Automatic: every pull request (ubuntu) and every push to main (ubuntu and windows),
# see docs/internal/decisions.md, 2026-11-09. Manual: gh workflow run ci.yml --ref <branch>
# One platform only: add -f os=windows or -f os=ubuntu. Nothing here may use secrets (fork PRs).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: Platform to run
        type: choice
        options: [all, ubuntu, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || inputs.os == 'ubuntu' && '["ubuntu-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build --configuration Release

      # Windows skips the tests already run on Linux (Trait Os=Independent).
      - name: Test (Linux, all tests)
        if: runner.os == 'Linux'
        run: dotnet test --configuration Release --no-build

      - name: Test (Windows, OS-specific tests only)
        if: runner.os == 'Windows'
        run: dotnet test --configuration Release --no-build --filter "Os!=Independent"

      - name: AOT publish
        run: dotnet publish src/Geeratya.Tui -c Release -o out

      - name: Smoke run (Linux)
        if: runner.os == 'Linux'
        run: ./out/geeratya --version

      - name: Smoke run (Windows)
        if: runner.os == 'Windows'
        run: ./out/geeratya.exe --version
