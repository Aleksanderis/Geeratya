# Updates Formula/geeratya.rb in the tap Aleksanderis/homebrew-tap when the owner publishes a release (#821, #917).
# The draft made by release.yml does not trigger it, so the archive URLs in the formula are public by then.
# Needs the repository secret HOMEBREW_TAP_TOKEN (fine-grained PAT, contents:write on the tap repo only; owner creates
# it, docs/internal/architecture.md, Releases). Without the secret the job ends green with a notice, so releases are not
# blocked; with a secret but an unreachable tap (repo missing, token expired) it fails, so a stale tap is visible.
# Pre-releases never update the tap. The tap is shared with the owner's other apps: only Formula/geeratya.rb is copied.
# Manual run for a version: `gh workflow run homebrew.yml -f version=0.4.0` (the release v<version> must be published).
name: homebrew

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (0.4.0, as in the tag)
        required: true

permissions:
  contents: read

concurrency:
  group: homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Update the tap
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "::notice::secret HOMEBREW_TAP_TOKEN is not set, tap not updated"; exit 0; fi
          version="${VERSION_INPUT:-${TAG#v}}"
          version="${version#v}"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir dl
          src/scripts/gen-manifests.sh "$version" dl/SHA256SUMS manifests
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          printf '#!/bin/sh\necho "$TAP_TOKEN"\n' > "$GIT_ASKPASS"; chmod 700 "$GIT_ASKPASS"
          export GIT_TERMINAL_PROMPT=0
          if ! git clone -q https://x-access-token@github.com/Aleksanderis/homebrew-tap.git tap; then
            echo "::error::cannot clone Aleksanderis/homebrew-tap (repo missing, token expired or without access)"; exit 1
          fi
          mkdir -p tap/Formula
          cp manifests/homebrew-tap/Formula/geeratya.rb tap/Formula/geeratya.rb
          cd tap
          git add Formula/geeratya.rb
          if git diff --cached --quiet; then echo "tap already up to date"; exit 0; fi
          git -c user.name="Geeratya release" -c user.email="noreply@users.noreply.github.com" commit -q -m "geeratya $version"
          git push -q origin HEAD
